[project]
name = "discovery-toolkit"
version = "0.2.0"
description = "Discovery/elicitation skill bundle: discovery-brief contract v1, gate-check linter, golden fixtures"
requires-python = ">=3.11"
dependencies = ["pyyaml>=6"]

[dependency-groups]
dev = [
    "pytest>=8",
    "ruff>=0.16.9",
]

[tool.uv]
package = false

[tool.ruff]
line-length = 88

[tool.ruff.lint]
# Набор правил зафиксирован явно: дефолт ruff меняется между версиями
# (0.16 расширил его), и без пина состав CI-проверки дрейфовал бы с uv.lock.
select = ["E4", "E7", "E9", "F"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
